[package]
name = "yunyu-drive"
# 版本号故意不写在这里。唯一来源是仓库根目录的 package.json：
#   - 打包产物（deb/rpm/NSIS/dmg）的版本来自 tauri.conf.json 的
#     `"version": "../package.json"`；
#   - Rust 代码里的版本来自 build.rs 注入的 env!("YUNYU_VERSION")。
# Cargo 允许省略 version（缺省 0.0.0），因此升版本不需要动这个文件，
# 也就不会牵动 Cargo.lock。
description = "云语聚合网盘 —— 夸克 / 移动云盘 / 阿里云盘 / 123 云盘 / 百度网盘 聚合客户端"
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.88"

[lib]
name = "yunyu_drive_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Used for production builds: serve the bundled frontend instead of a dev server.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# build.rs 要读 package.json 取版本号，再以 rustc-env 注入。
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
futures-util = "0.3"
bytes = "1"
md-5 = "0.10"
sha1 = "0.10"
directories = "5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
libquarkpan = { path = "../vendor/libquarkpan", default-features = false, features = ["rustls"] }
tauri-plugin-single-instance = "2"
http = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "query", "cookies", "form", "multipart"] }
base64 = "0.22"
tauri-plugin-notification = "2"
async-trait = "0.1"
# 中国移动云盘 (139): MIT-licensed Rust client, used as a library.
# 两个依赖都 vendored 进本仓库（见 vendor/README.md），以便在 CI 中独立构建。
cloud139 = { path = "../vendor/cloud139" }
# Hex encoding for the 139 token / 123 云盘 signatures.
toml = "0.9"
hex = "0.4"
hmac = "0.12"
rsa = "0.9"
p224 = { version = "0.13", features = ["ecdh"] }
lz4_flex = "0.11"
crc32fast = "1"
num-bigint = "0.4"
rand = "0.8"
percent-encoding = "2"
k256 = { version = "0.13.4", features = ["ecdsa"] }
sha2 = "0.10.9"
# AES-256-CBC for the 139 user-profile endpoint (`cloud139` only does AES-128).
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }

# Deterministic clocks in tests: `start_paused` needs `test-util`.
[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
